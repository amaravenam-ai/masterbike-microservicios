    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-inventario:3306/inventario_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Defina la clave local}
      JAVA_TOOL_OPTIONS: -Xmx192m
  masterbikes-ventas:
