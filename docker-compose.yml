      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Defina la clave local}
      JAVA_TOOL_OPTIONS: -Xmx192m
volumes:
  mysql_cliente_data: null
  mysql_servicio_tecnico_data: null
  mysql_usuario_data: null
  mysql_bicicleta_data: null
  mysql_arriendo_data: null
  mysql_inventario_data: null
  mysql_venta_data: null
  mysql_despacho_data: null
