name: Verificación de portafolio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -ntp '-Dtest=*ServiceTest,*ControllerTest' -Dsurefire.failIfNoSpecifiedTests=false verify
  integracion:
    runs-on: ubuntu-latest
    needs: comprobar
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configuración efímera de demostración
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text(''.join(k+'='+secrets.token_hex(20)+'\n' for k in ['MYSQL_ROOT_PASSWORD','MYSQL_PASSWORD']))
          PY
      - run: docker compose up --build -d
      - run: python scripts/comprobar_recorrido.py --snapshot .local/recorrido.json --espera 240
      - run: python scripts/verificar_migraciones.py
      - run: docker compose restart
      - run: python scripts/comprobar_recorrido.py --snapshot .local/recorrido.json --verificar-persistencia --espera 240
      - name: Diagnóstico si falla
        if: failure()
        run: docker compose logs --tail 80
      - name: Detener entorno de CI
        if: always()
        run: docker compose down
